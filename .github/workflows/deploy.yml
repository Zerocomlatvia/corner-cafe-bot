# GitHub Actions workflow for auto-deploy to Railway
# Требует секреты в GitHub: RAILWAY_TOKEN, RAILWAY_SERVICE, RAILWAY_PROJECT
# Получить токен: railway login → railway token

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link --project ${{ secrets.RAILWAY_PROJECT }} --service ${{ secrets.RAILWAY_SERVICE }}
          railway up --detach